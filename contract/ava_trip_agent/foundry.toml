[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# vm.writeJson 默认只允许写项目根目录，部署产物要写到仓库根的 deployments/
# 路径相对于 foundry.toml 所在目录（即本项目根目录）
fs_permissions = [
    { access = "read-write", path = "../../deployments" },
]

[rpc_endpoints]
fuji = "https://api.avax-test.network/ext/bc/C/rpc"
monad = "https://testnet-rpc.monad.xyz"
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"

# Fuji 上用 Routescan 的 Etherscan 兼容接口做验证
[etherscan]
fuji = { key = "${SNOWTRACE_API_KEY}", url = "https://api.routescan.io/v2/network/testnet/evm/43113/etherscan/api" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
